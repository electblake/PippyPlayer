<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><title>PippyPlayer Remote</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101820;color:#eef5f3}*{box-sizing:border-box}body{margin:0;padding:12px}main{max-width:520px;margin:auto}.card{background:#1a252c;border:1px solid #35454a;padding:16px;border-radius:12px;margin-bottom:12px}label,legend{display:block;font-size:14px;font-weight:650;margin-bottom:12px}button:disabled{opacity:.4;cursor:default}#nowPlaying{overflow-wrap:anywhere;font-size:14px;color:#9af3c5}#url,select{width:100%;font:inherit;border:1px solid #56666d;background:#101820;color:white;border-radius:10px;padding:14px;margin-bottom:14px}button{font:inherit;font-weight:650;border:1px solid #52646b;border-radius:10px;padding:13px;background:#26373f;color:#eef5f3;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9af3c5;outline-offset:3px}.primary{width:100%;background:#9af3c5;color:#101820;border-color:#9af3c5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{height:54px;font-size:22px}.grid button[aria-pressed=true]{background:#9af3c5;color:#101820;border-color:#9af3c5}.row{display:flex;justify-content:space-between;gap:8px}.row button{flex:1}.playback{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.playback button{padding:13px 2px;font-size:14px}.range{margin-top:24px}.range label{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#9af3c5}fieldset{border:0;padding:0;margin:0}#status{font-size:13px;overflow-wrap:anywhere;min-height:20px}
</style></head><body><main><form id="controls"><section class="card"><label for="url">Video URL</label><input id="url" name="url" type="text" inputmode="url" placeholder="Video URL or performer/tag URI" required><button class="primary" type="submit">Play</button><p id="status" role="status"></p><div class="playback"><button type="button" data-action="skip-backward" aria-label="Skip backward 10 seconds" title="Skip backward 10 seconds" disabled>↶ 10s</button><button type="button" data-action="play">Resume</button><button type="button" data-action="pause">Pause</button><button type="button" data-action="stop">Stop</button><button type="button" data-action="skip-forward" aria-label="Skip forward 10 seconds" title="Skip forward 10 seconds" disabled>10s ↷</button></div><p id="nowPlaying" aria-live="polite"></p><div class="row"><button type="button" data-action="previous" disabled>Previous</button><button type="button" data-action="next" disabled>Next</button></div><div class="range"><label for="sorting">Sorting</label><select id="sorting"><option value="DEFAULT">Default</option><option value="LENGTH_SHORTEST">Length (Shortest)</option><option value="LENGTH_LONGEST">Length (Longest)</option><option value="NAME">Name</option><option value="RANDOM">Random</option></select></div></section>
<section class="card"><fieldset><legend>Position</legend><div class="grid" id="positions"></div></fieldset>
<div class="range"><label for="size">Size <output id="sizeValue">30%</output></label><input type="range" id="size" name="size" min="15" max="90" value="30"></div>
<div class="range"><label for="zoom">Zoom <output id="zoomValue">1.0×</output></label><input type="range" id="zoom" name="zoom" min="1" max="3" step="0.1" value="1"></div>
<div class="range"><label for="volume">Volume <output id="volumeValue">50%</output></label><input type="range" id="volume" name="volume" min="0" max="100" value="50"></div></section></form><section class="card"><label for="debugEnabled" style="display:flex;align-items:center;gap:10px;margin:18px 0 0"><input id="debugEnabled" type="checkbox" role="switch" style="accent-color:#9af3c5;width:20px;height:20px">Debug info on TV and remote</label><div id="debugPanel" hidden><pre id="debugInfo" style="white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere"></pre><p style="font-size:13px">Media input is actual stream throughput, not your connection’s maximum speed. Reads can arrive in bursts. Buffering progress is VLC’s last buffering event, not free buffer space.</p></div></section></main>
<script>
const base = location.pathname.replace(/\/$/, '');
const form = document.querySelector('form'), status = document.querySelector('#status');
const positions = ['TOP_LEFT','TOP_CENTER','TOP_RIGHT','MIDDLE_LEFT','MIDDLE_CENTER','MIDDLE_RIGHT','BOTTOM_LEFT','BOTTOM_CENTER','BOTTOM_RIGHT'];
const arrows = ['↖','↑','↗','←','•','→','↙','↓','↘'];
let position = 'BOTTOM_RIGHT';
function selectPosition(value) { position=value; document.querySelectorAll('#positions button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.position===value))); }
positions.forEach((value,i)=>{const b=document.createElement('button'); b.type='button';b.textContent=arrows[i];b.title=value.toLowerCase().replaceAll('_',' ');b.setAttribute('aria-label',b.title);b.dataset.position=value;b.onclick=async()=>{selectPosition(value);await apply();};document.querySelector('#positions').append(b);});
function labels(){for(const id of ['size','zoom','volume'])document.querySelector('#'+id+'Value').textContent=document.querySelector('#'+id).value+(id==='zoom'?'×':'%');}
async function state(){return (await fetch(base+'/state')).json();}
async function apply(){const body=new URLSearchParams(new FormData(form));body.set('position',position);status.textContent=await (await fetch(base+'/config',{method:'POST',body})).text();}
form.onsubmit=async event=>{event.preventDefault();await apply();status.textContent='Loading…';const body=new URLSearchParams({url:document.querySelector('#url').value});status.textContent=await(await fetch(base+'/source',{method:'POST',body})).text();showStatus(await state());};
for(const id of ['size','zoom','volume']){const input=document.querySelector('#'+id);input.oninput=labels;input.onchange=apply;}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{status.textContent=await (await fetch(base+'/'+b.dataset.action,{method:'POST'})).text();showStatus(await state());});
const sorting=document.querySelector('#sorting');
sorting.onchange=async()=>{const body=new URLSearchParams({sorting:sorting.value});status.textContent=await(await fetch(base+'/sorting',{method:'POST',body})).text();showStatus(await state());};
async function start(){const s=await state();for(const id of ['url','size','zoom','volume'])document.querySelector('#'+id).value=s[id];selectPosition(s.position);labels();showStatus(s);setInterval(async()=>showStatus(await state()),1500);}
function showStatus(s){
sorting.value=s.sorting;
document.querySelectorAll('[data-action="skip-backward"],[data-action="skip-forward"]').forEach(b=>b.disabled=!s.seekable);
document.querySelector('#debugEnabled').checked=s.debugEnabled;document.querySelector('#debugPanel').hidden=!s.debugEnabled;document.querySelector('#debugInfo').textContent=s.debugText;
const current=s.queue[s.queueIndex];document.querySelector('#nowPlaying').textContent=current?`${s.queueIndex+1} / ${s.queue.length}`:'';
document.querySelector('[data-action=previous]').disabled=!s.hasPrevious;document.querySelector('[data-action=next]').disabled=!s.hasNext;
status.textContent=s.error!==null?s.error:(s.playing?'Playing':s.playbackState===1?'Loading…':s.playbackState===2?'Buffering…':s.playbackState===6?'Ended':s.queue.length?'Paused':'');}
document.querySelector('#debugEnabled').onchange=async event=>{const body=new URLSearchParams({enabled:String(event.target.checked)});await fetch(base+'/debug',{method:'POST',body});showStatus(await state());};
start();
</script></body></html>
