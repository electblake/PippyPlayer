<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><title>PippyPlayer Remote</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101820;color:#eef5f3}*{box-sizing:border-box}body{margin:0;padding:12px}main{max-width:520px;margin:auto}.card{background:#1a252c;border:1px solid #35454a;padding:16px;border-radius:12px;margin-bottom:12px}label,legend{display:block;font-size:14px;font-weight:650;margin-bottom:12px}button:disabled{opacity:.4;cursor:default}#nowPlaying{overflow-wrap:anywhere;font-size:14px;color:#9af3c5}#url,select{width:100%;font:inherit;border:1px solid #56666d;background:#101820;color:white;border-radius:10px;padding:14px;margin-bottom:14px}button{font:inherit;font-weight:650;border:1px solid #52646b;border-radius:10px;padding:13px;background:#26373f;color:#eef5f3;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9af3c5;outline-offset:3px}.primary{width:100%;background:#9af3c5;color:#101820;border-color:#9af3c5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{height:54px;font-size:22px}.grid button[aria-pressed=true]{background:#9af3c5;color:#101820;border-color:#9af3c5}.row{display:flex;justify-content:space-between;gap:8px}.row button{flex:1}.playback{display:grid;grid-template-columns:repeat(8,minmax(44px,1fr));gap:6px}.playback button{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px}.playback svg{width:24px;height:24px;fill:currentColor}.playback .seek{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.playback .seek text{fill:currentColor;stroke:none;font:700 10px system-ui,sans-serif}@media(max-width:459px){.playback{grid-template-columns:repeat(4,minmax(44px,1fr))}}.range{margin-top:24px}.range label{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#9af3c5}fieldset{border:0;padding:0;margin:0}#status{font-size:13px;overflow-wrap:anywhere;min-height:20px}
#status.loading{display:flex;align-items:center;gap:10px;color:#9af3c5}#status.loading::before{content:"";width:16px;height:16px;flex:0 0 16px;border:2px solid #35454a;border-top-color:#9af3c5;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#status.loading::before{animation:none}}
</style></head><body><main><form id="controls"><section class="card"><label for="url">Video URL</label><input id="url" name="url" type="text" inputmode="url" placeholder="Video URL or performer/tag URI" required><button class="primary" type="submit">Play</button><p id="status" role="status"></p><div class="playback" role="group" aria-label="Playback controls"><button type="button" data-action="previous" aria-label="Previous video" title="Previous video" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class=""><path d="M5 5h3v14H5zM19 5v14L9 12z"/></svg></button><button type="button" data-action="skip-backward" aria-label="Skip backward 10 seconds" title="Skip backward 10 seconds" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="seek"><path d="M4 8a9 9 0 1 1-1 8M4 3v5h5"/><text x="12" y="16" text-anchor="middle">10</text></svg></button><button type="button" data-action="play" aria-label="Resume playback" title="Resume playback"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class=""><path d="m7 4 14 8-14 8z"/></svg></button><button type="button" data-action="pause" aria-label="Pause playback" title="Pause playback"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class=""><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button><button type="button" data-action="stop" aria-label="Stop playback" title="Stop playback"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class=""><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button><button type="button" data-action="skip-forward" aria-label="Skip forward 10 seconds" title="Skip forward 10 seconds" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="seek"><path d="M20 8a9 9 0 1 0 1 8M20 3v5h-5"/><text x="12" y="16" text-anchor="middle">10</text></svg></button><button type="button" data-action="next" aria-label="Next video" title="Next video" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class=""><path d="M16 5h3v14h-3zM5 5l10 7-10 7z"/></svg></button><button type="button" data-action="toggle-visibility" aria-label="Show player and resume" title="Show player and resume" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="seek"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eyeSlash" d="m3 3 18 18"/></svg></button></div><p id="nowPlaying" aria-live="polite"></p><div class="range"><label for="sorting">Sorting</label><select id="sorting"><option value="DEFAULT">Default</option><option value="LENGTH_SHORTEST">Length (Shortest)</option><option value="LENGTH_LONGEST">Length (Longest)</option><option value="NAME">Name</option><option value="RANDOM">Random</option></select></div></section>
<section class="card"><fieldset><legend>Position</legend><div class="grid" id="positions"></div></fieldset>
<div class="range"><label for="size">Size <output id="sizeValue">30%</output></label><input type="range" id="size" name="size" min="15" max="90" value="30"></div>
<div class="range"><label for="zoom">Zoom <output id="zoomValue">1.0×</output></label><input type="range" id="zoom" name="zoom" min="1" max="3" step="0.1" value="1"></div>
<div class="range"><label for="volume">Volume <output id="volumeValue">50%</output></label><input type="range" id="volume" name="volume" min="0" max="100" value="50"></div></section></form><section class="card"><label for="debugEnabled" style="display:flex;align-items:center;gap:10px;margin:18px 0 0"><input id="debugEnabled" type="checkbox" role="switch" style="accent-color:#9af3c5;width:20px;height:20px">Debug info on TV and remote</label><div id="debugPanel" hidden><pre id="debugInfo" style="white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere"></pre><p style="font-size:13px">Network input includes current playback and next-video preloading, not your connection’s maximum speed. Buffered time measures playable media ahead. The decoder name identifies the active hardware video decoder.</p></div></section></main>
<script>
const base = location.pathname.replace(/\/$/, '');
const form = document.querySelector('form'), status = document.querySelector('#status');
const positions = ['TOP_LEFT','TOP_CENTER','TOP_RIGHT','MIDDLE_LEFT','MIDDLE_CENTER','MIDDLE_RIGHT','BOTTOM_LEFT','BOTTOM_CENTER','BOTTOM_RIGHT'];
const arrows = ['↖','↑','↗','←','•','→','↙','↓','↘'];
let position = 'BOTTOM_RIGHT';
let sourceLoading = false;
function selectPosition(value) { position=value; document.querySelectorAll('#positions button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.position===value))); }
positions.forEach((value,i)=>{const b=document.createElement('button'); b.type='button';b.textContent=arrows[i];b.title=value.toLowerCase().replaceAll('_',' ');b.setAttribute('aria-label',b.title);b.dataset.position=value;b.onclick=async()=>{selectPosition(value);await apply();};document.querySelector('#positions').append(b);});
function labels(){for(const id of ['size','zoom','volume'])document.querySelector('#'+id+'Value').textContent=document.querySelector('#'+id).value+(id==='zoom'?'×':'%');}
async function state(){return (await fetch(base+'/state')).json();}
async function apply(){const body=new URLSearchParams(new FormData(form));body.set('position',position);status.textContent=await (await fetch(base+'/config',{method:'POST',body})).text();}
form.onsubmit=async event=>{event.preventDefault();await apply();sourceLoading=true;status.classList.add('loading');status.setAttribute('aria-busy','true');status.textContent='Loading source…';const body=new URLSearchParams({url:document.querySelector('#url').value});status.textContent=await(await fetch(base+'/source',{method:'POST',body})).text();sourceLoading=false;showStatus(await state());};
for(const id of ['size','zoom','volume']){const input=document.querySelector('#'+id);input.oninput=labels;input.onchange=apply;}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{status.textContent=await (await fetch(base+'/'+b.dataset.action,{method:'POST'})).text();showStatus(await state());});
const sorting=document.querySelector('#sorting');
sorting.onchange=async()=>{const body=new URLSearchParams({sorting:sorting.value});status.textContent=await(await fetch(base+'/sorting',{method:'POST',body})).text();showStatus(await state());};
async function start(){const s=await state();for(const id of ['url','size','zoom','volume'])document.querySelector('#'+id).value=s[id];selectPosition(s.position);labels();showStatus(s);setInterval(async()=>showStatus(await state()),1500);}
function showStatus(s){
sorting.value=s.sorting;
const visibilityButton=document.querySelector('[data-action="toggle-visibility"]');
visibilityButton.disabled=!s.queueLength;
visibilityButton.setAttribute('aria-pressed',String(s.visible));
visibilityButton.title=s.visible?'Hide player and pause':'Show player and resume';
visibilityButton.setAttribute('aria-label',visibilityButton.title);
document.querySelector('#eyeSlash').style.display=s.visible?'none':'';
document.querySelectorAll('[data-action="skip-backward"],[data-action="skip-forward"]').forEach(b=>b.disabled=!s.seekable);
document.querySelector('#debugEnabled').checked=s.debugEnabled;document.querySelector('#debugPanel').hidden=!s.debugEnabled;document.querySelector('#debugInfo').textContent=s.debugText;
document.querySelector('#nowPlaying').textContent=s.queueLength?`${s.queueIndex+1} / ${s.queueLength}`:'';
document.querySelector('[data-action=previous]').disabled=!s.hasPrevious;document.querySelector('[data-action=next]').disabled=!s.hasNext;
const busy=sourceLoading||(s.error===null&&s.loading);status.classList.toggle('loading',busy);status.setAttribute('aria-busy',String(busy));
status.textContent=sourceLoading?'Loading source…':s.error!==null?s.error:s.loading?s.loadingText:s.queueLength?s.playbackState:'';}
document.querySelector('#debugEnabled').onchange=async event=>{const body=new URLSearchParams({enabled:String(event.target.checked)});await fetch(base+'/debug',{method:'POST',body});showStatus(await state());};
start();
</script></body></html>
